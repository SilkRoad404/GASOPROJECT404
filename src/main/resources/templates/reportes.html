<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes - GASOPROJECT404</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
<div class="main">
    <a href="/dashboard" style="color:#a0aec0;text-decoration:none;">&#8592; Volver al Dashboard</a>
    <div class="card" style="margin-top:16px;">
        <h2>&#128202; Reporte de Asistencia</h2>
        <div th:if="${mensaje}" class="alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>
        <pre style="white-space:pre-wrap;background:#1a202c;padding:16px;border-radius:8px;" th:text="${contenido}"></pre>
        <a href="/reportes/enviar" class="btn btn-primary">Enviar por correo</a>
    </div>
</div>
</body>
</html>
